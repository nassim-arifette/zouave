# Fetches the public-domain 1910 flood photographs (scripts/fetch-1910.mjs) from Wikimedia Commons and commits them,
# so the "Memory of 1910" pins and Story step work offline. Run it manually from the Actions tab.
name: Fetch 1910 flood photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch photographs (public domain only)
        run: node scripts/fetch-1910.mjs
      - name: Commit the photographs and their manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/memoire
          if git diff --cached --quiet; then echo "No new photographs."; exit 0; fi
          git commit -m "Add public-domain 1910 flood photographs from Wikimedia Commons"
          git push
